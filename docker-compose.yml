version: "3.8"

services:
  backend:
    build:
      context: ./backend
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    container_name: happy-cloud-backend
    restart: unless-stopped
    ports:
      # 主机 8889 → 容器 8080（8080 落在 Windows 保留段 8001-8100 内，无法绑定）
      - "${BACKEND_PORT:-8889}:8080"
      # 内置 STUN（UDP）：P2P 打洞 reflection 用
      - "3478:3478/udp"
      # ICE 媒体端口段（UDP）：容器内的 172.x 地址在宿主机侧不可路由，
      # 必须把 ICE 固定到这一段并发布到宿主机，浏览器/手机才能连上来完成打洞
      - "${P2P_UDP_PORT_MIN:-50000}-${P2P_UDP_PORT_MAX:-50019}:${P2P_UDP_PORT_MIN:-50000}-${P2P_UDP_PORT_MAX:-50019}/udp"
    environment:
      SERVER_PORT: "8080"
      DB_DSN: "root:${MYSQL_ROOT_PASSWORD:-happycloud123}@tcp(mysql:3306)/happy_cloud?charset=utf8mb4&parseTime=True&loc=Local"
      JWT_SECRET: "${JWT_SECRET:-happy-cloud-prod-secret-change-me}"
      STORAGE_PATH: "/data/happy-cloud"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-password}"
      CORS_ORIGINS: "*"
      # ---- P2P 打洞 ----
      P2P_ENABLED: "${P2P_ENABLED:-true}"
      P2P_STUN_ENABLED: "true"
      P2P_STUN_ADDR: ":3478"
      SIGNALING_URL: "ws://signaling:8787"
      SIGNALING_PORT: "8787"
      # 下发给客户端的信令/STUN 地址。留空则由请求的 Host 头自动推导：
      # 本机访问推导出 localhost，手机走 http://192.168.2.20:8888 则推导出局域网 IP，
      # 两种场景都能拿到可用的信令/STUN 地址。
      PUBLIC_HOST: "${PUBLIC_HOST:-}"
      P2P_HOST_ROOM: "happy-cloud"
      # ICE 对外广播的宿主机地址：容器内网地址客户端不可达，必须换成宿主机在局域网的 IP
      P2P_ADVERTISE_IP: "${P2P_ADVERTISE_IP:-}"
      P2P_UDP_PORT_MIN: "${P2P_UDP_PORT_MIN:-50000}"
      P2P_UDP_PORT_MAX: "${P2P_UDP_PORT_MAX:-50019}"
    volumes:
      - data:/data/happy-cloud
    depends_on:
      - mysql
      - redis
      - signaling

  # 独立信令服务器：仅透传 SDP/ICE 的房间配对，鉴权在后端隧道内完成
  signaling:
    build:
      context: ./backend
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    command: ["/app/signaling" ]
    container_name: happy-cloud-signaling
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      SIGNALING_PORT: "${SIGNALING_PORT:-8787}"

  web:
    build:
      context: ./web
    container_name: happy-cloud-web
    restart: unless-stopped
    ports:
      # 主机 8888 映射到容器 80（8000/8001 均被系统保留/占用，故用 8888）
      - "8888:80"
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: happy-cloud-mysql
    restart: unless-stopped
    ports:
      # 开发调试用，生产环境建议移除
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-happycloud123}"
      MYSQL_DATABASE: "happy_cloud"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-happycloud123}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: happy-cloud-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

  # 可选：MinIO 对象存储（默认使用本地磁盘存储，接入 MinIO 时在 backend 中配置）
  # minio:
  #   image: minio/minio:latest
  #   container_name: happy-cloud-minio
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
  #     MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio-data:/data

volumes:
  data:
  mysql-data:
  redis-data:
  # minio-data:
