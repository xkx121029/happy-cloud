server {
    listen 80;
    server_name _;
    client_max_body_size 0;

    root /usr/share/nginx/html;
    index index.html;

    # 已知前端路由前缀 → SPA 回退到 index.html（客户端路由无对应物理文件）
    # 正则 location 优先级高于前缀 location，故先命中此处；其余路径落入下方 location /
    location ~ ^/(login|register|share|shared|notifications|trash|shares|admin|browse)(/|$) {
        try_files $uri $uri/ /index.html;
    }

    # 前端单页应用：其余路径尝试真实文件；找不到时返回真实 404（而非 SPA 一律 200）
    location / {
        try_files $uri $uri/ =404;
    }

    # 入口 HTML 不缓存：否则发新版后浏览器仍跑旧 JS（hash 资源本身可长缓存）
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
