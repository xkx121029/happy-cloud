# NAS 部署专用 compose：使用本地已加载的 arm64 镜像（不经 build）
services:
  backend:
    image: happy-cloud/backend:arm64
    container_name: happy-cloud-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DB_DSN: "root:happycloud123@tcp(mysql:3306)/happy_cloud?charset=utf8mb4&parseTime=True&loc=Local"
      JWT_SECRET: "happy-cloud-prod-secret-change-me"
      STORAGE_PATH: "/data/happy-cloud"
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "password"
      CORS_ORIGINS: "*"
    volumes:
      - data:/data/happy-cloud
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: happy-cloud/web:arm64
    container_name: happy-cloud-web
    restart: unless-stopped
    ports:
      # 主机 8000 映射到容器 80（避免与 NAS 系统 nginx 的 80 端口冲突）
      - "8000:80"
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: happy-cloud-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "happycloud123"
      MYSQL_DATABASE: "happy_cloud"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-phappycloud123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: happy-cloud-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  data:
  mysql-data:
  redis-data:
